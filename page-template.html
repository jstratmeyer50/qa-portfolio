<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{PAGE_TITLE}} | QA Portfolio</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .breadcrumb {
      margin-bottom: 2rem;
      font-size: 0.9rem;
      color: #9ccfff;
    }
    .breadcrumb a {
      color: #8ec9ff;
    }
    .content-header {
      margin-bottom: 2rem;
    }
    .content-header h1 {
      margin: 0 0 1rem 0;
    }
    .meta-info {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      margin: 1.5rem 0;
      padding: 1rem;
      background: rgba(8, 20, 29, 0.45);
      border-left: 3px solid rgba(142, 201, 255, 0.5);
      border-radius: 3px;
    }
    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .meta-label {
      font-size: 0.8rem;
      color: #9ccfff;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .meta-value {
      color: #dcecff;
      font-weight: 600;
    }
    .document-content {
      line-height: 1.8;
      color: #dcecff;
    }
    .document-content h2 {
      margin: 2rem 0 1rem 0;
      border-bottom: 1px solid rgba(142, 201, 255, 0.2);
      padding-bottom: 0.5rem;
    }
    .document-content h3 {
      margin: 1.5rem 0 0.75rem 0;
      color: #b7d9ff;
    }
    .document-content p {
      margin: 1rem 0;
    }
    .document-content ul,
    .document-content ol {
      margin: 1rem 0;
      padding-left: 2rem;
    }
    .document-content li {
      margin: 0.5rem 0;
    }
    .document-content table {
      width: 100%;
      margin: 1.5rem 0;
      border-collapse: collapse;
      border: 1px solid rgba(142, 201, 255, 0.3);
    }
    .document-content th,
    .document-content td {
      padding: 0.75rem;
      text-align: left;
      border: 1px solid rgba(142, 201, 255, 0.2);
    }
    .document-content th {
      background: rgba(9, 22, 31, 0.5);
      font-weight: 700;
      color: #b7d9ff;
    }
    .document-content td {
      background: rgba(0, 10, 0, 0.2);
    }
    .document-content code {
      background: rgba(0, 10, 0, 0.5);
      padding: 0.2rem 0.4rem;
      border-radius: 2px;
      font-family: "Courier New", Courier, monospace;
      color: #b7d9ff;
    }
    .document-content pre {
      background: rgba(0, 10, 0, 0.6);
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
      margin: 1.5rem 0;
      border-left: 3px solid rgba(142, 201, 255, 0.4);
    }
    .document-content pre code {
      background: none;
      padding: 0;
      color: #b7d9ff;
    }
    .document-content blockquote {
      border-left: 3px solid rgba(142, 201, 255, 0.5);
      padding-left: 1rem;
      margin-left: 0;
      color: #9ccfff;
      font-style: italic;
    }
    .document-content hr {
      border: none;
      border-top: 1px solid rgba(142, 201, 255, 0.2);
      margin: 2rem 0;
    }
    .back-link {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.5rem 1rem;
      background: rgba(142, 201, 255, 0.08);
      border: 1px solid rgba(142, 201, 255, 0.35);
      border-radius: 3px;
      color: #8ec9ff;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .back-link:hover {
      background: rgba(142, 201, 255, 0.15);
      border-color: rgba(142, 201, 255, 0.8);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div>
        <h1>Jess Stratmeyer</h1>
        <p class="lead">QA Portfolio</p>
      </div>      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">
        <span class="nav-toggle__icon" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
        <span class="nav-toggle__label">Menu</span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
<a href="./index.html">Home</a>
        <a href="./about.html">About</a>
        <a href="./case-files.html">Case Files</a>
        <a href="./skills.html">Skills</a>
        <a href="./contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section container">
      <div class="breadcrumb">
        <a href="./index.html">Home</a> / {{FOLDER_TITLE}} / {{PAGE_TITLE}}
      </div>

      <div class="content-header">
        <h1>{{PAGE_TITLE}}</h1>
      </div>

      <!-- Document Content Goes Here -->
      <div class="document-content">
        {{DOCUMENT_CONTENT}}
      </div>

      <a href="./case-files.html" class="back-link">← Back to {{FOLDER_TITLE}}</a>
    </section>
  </main>

  <footer style="text-align: center; padding: 2rem; color: #9ccfff; font-size: 0.9rem; border-top: 1px solid rgba(142, 201, 255, 0.2); margin-top: 3rem;">
    <p>&copy; 2024 Jess Stratmeyer | QA Portfolio</p>
  </footer>
  <script>
    const navToggle = document.querySelector('.nav-toggle');
    const siteNav = document.querySelector('.site-nav');

    if (navToggle && siteNav) {
      navToggle.addEventListener('click', () => {
        const isOpen = siteNav.classList.toggle('is-open');
        navToggle.setAttribute('aria-expanded', String(isOpen));
      });

      siteNav.querySelectorAll('a').forEach((link) => {
        link.addEventListener('click', () => {
          siteNav.classList.remove('is-open');
          navToggle.setAttribute('aria-expanded', "false");
        });
      });
    }
  </script>
</body>
</html>
